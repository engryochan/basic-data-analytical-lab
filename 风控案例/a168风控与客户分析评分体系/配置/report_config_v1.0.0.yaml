  purpose: 十五类风险会员判据商业方案之【软配置册】——一切阈值、分位、样本门、命名空间、
    字段别名、呈表尺寸、模型名册、管线定义一律登记于此，引擎与模板只取本册，
    不得在代码或正文内硬写。改参数只改本册，十五份重跑即同步。
  iron_rule: 硬代码／硬字符／硬数值／硬字段一律归此册；本册未登记者，引擎须报错而非默认。

# ── 命名空间（与 配置/paths_a168.R 同源；改布局只改此处） ──────────────
namespaces:
  delivery: 数据库          # 交付件 CSV（2026-09-03 · commit 6e53299 改回；R100 纯改名，内容逐位未变）
  exec: 函数                # R／SQL 执行件
  spec: 规范                # 登记册、术语库
  config: 配置              # 本册与导出参数
  audit: 审计               # 基线／查询稿／证据／工具
  analysis: 分析            # 报告产出
  template: 模板            # 模板

# ── SQL 总包名册：交付件之取数原文出处（血统之根）────────────────────
#   ⛔ 铁律：交付件**非无中生有自动生成**，而是于 Superset 执行下列总包内之
#     对应模块、查 StarRocks 之 ODS 层后**下载落盘**至 namespaces.delivery。
#     故报表须能就地出示「本件由哪段 SQL 所出」，档名一律登记于此，禁写死于码内。
sql_pack:
  dir: 函数                      # 总包所在命名空间（与 namespaces.exec 同）
  default_variant: 原版审计版      # 本套报告之默认溯源口径
  max_inline_lines: 0            # 单模块内嵌行上限；0 即【全文不截】（禁截铁律）
  variants:
    - 版: 原版审计版
      档: a168_SQL总包_v12_0_0_HF9g-P5D_原版审计版_六层商业版_OPT.sql
      用途: 六层商业指标 ＋ audit_rn 全序，不切片一次导全；审计与溯源之正典口径
    - 版: 分批作业版
      档: a168_SQL总包_v12_0_0_HF9g-P5D_分批作业版_六层商业版_OPT.sql
      用途: 同一口径加 ORDER BY 全序 ＋ OFFSET 分批落盘；巨件导出用
    - 版: 分批作业版1万
      档: a168_SQL总包_v12_0_0_HF9g-P5D_分批作业版1万_六层商业版_OPT.sql
      用途: 每批一万行之分批落盘；节点吃紧时用
  deliverable_credibility: 规范/deliverable_credibility_v1.0.0.csv   # 逐件可信度清单（派生自总包档头 133 行）

# ── 口径正名：hold 族三量并存，分母各异，禁裸称 hold ──────────────────
#   ⛔ 2026-09-03 全档实测（S01_player_score.csv · 723,442 会员 · 可信度 OK）：
#     Σstake 13,436,093,473.804 ／ Σvalid_bet 12,101,545,165.175 ／ Σprofit 225,932,201.626
metric_canon:
  hold_family:
    - 名: hold_rate
      算式: profit ÷ stake
      总包出处: 六层块 ROUND(-e.net/NULLIF(e.stake,0),8) AS hold_rate · 128 处
      实测值: 1.681532 %
      验证: 与 profit/stake 逐行比对 723,442 行，偏离全数落在 ROUND(·,4) 之舍入上界内，越界 0 行 ⇒ 恒等
      注: 平台对【本金】之已实现毛利率；总包正典列
    - 名: roi
      算式: net ÷ stake（玩家视角，正＝玩家赚）
      总包出处: 六层块 ROUND(e.net/NULLIF(e.stake,0),8) AS roi
      实测值: −1.681532 %
      验证: roi ＋ hold_rate 逐行求和，723,442 行 100.000000% 恒为 0，max|·| ＝ 0 ⇒ roi ≡ −hold_rate
      注: ⛔ roi 之分母是 stake 而非 valid_bet；《参考.txt》称 hold ≡ roi 者，其 roi 定义有误
    - 名: hold_valid_bet
      算式: profit ÷ valid_bet
      总包出处: ⛔ 总包无此列 —— 本引擎派生
      实测值: 1.866970 %
      验证: 1.681532% ÷ (valid_bet/stake ＝ 90.067438%) ＝ 1.866970%，与逐面加权实测同值
      注: 引用时必带分母；与上二者分母不同，禁互换、禁直接比较
    - 名: house_edge_theoretical
      算式: 规则理论概率下之庄家优势（非任何 profit/valid_bet 之比值）
      总包出处: ⛔ 全库 131 件零栏在位；总包 house_edge = NULL
      实测值: NULL —— ⛔ 不得以 realized 值顶替
      验证: 授权未下；且 #017 探针 R3 实测 overdispersion Q/(k−1) = 9.3~42.6，单一常数 edge 架构已 KILL
      注: ⛔ KILLCRITIC-01：realized hold ≠ theoretical house edge；混称即污染 theo／ADT／NMPT／ESI 全链
    - 名: house_hold_pct
      算式: −player_pnl ÷ stake_total
      总包出处: DX04_bet09_profile 自有栏 · 逐投注面
      实测值: 逐面各异（Banker 1.238% … Super6 20.656%）
      验证: 与 审计/实测庄家优势_逐投注面 之 edge_vs_stake 同源互证
      注: 逐投注面口径，非会员级；不得与会员级 hold_rate 混算
  house_edge:
    口径: realized（已实现，含运气）· ⛔ 非理论 edge
    权限: SELECT-only 即可现算 —— 无须 CREATE／APPEND／DELETE
    探针: 函数/HE_house_edge_SELECT_only_探针_v1.0.0.sql
    落盘: 审计/实测庄家优势_逐投注面_v1.0.0_20260903.csv
    加权实测: {对洗码: 1.866970 %, 对本金: 1.681532 %}
    阻断: 总包所阻断者系【理论】edge 之授权与 bet09 级 valid_bet 分解；realized edge 不在阻断之列
    禁令: 未知产品码 → theo NULL，⛔ 禁 fallback = 1（NULL ≠ 0）；免佣与一般桌禁共用同一静态 edge

# ── 极性登记册：指标 × 视角 × 经济极性（⛔ 禁由代码默认「越大越好」）──────
#   ⛔ 立此册之由：极性陷阱两轮各中一次 ——
#     N-14 首轮：d_roi 系玩家视角，其下降即平台得利，引擎默认「越大越好」遂判「退化」，总闸 FAIL 反向。
#     N-14 次轮：游戏输赢贡献 系【平台】视角，我方 OOS 脚本按玩家视角取负，算出 hold = −1.5048%。
#   实测定谳（S05 · 168,103 会员）：逐会员 Σ游戏输赢贡献 ÷ profit 中位 = 1.000000（相关 0.9874）；
#     ÷ roi_numerator 中位 = −1.000000 ⇒ 游戏输赢贡献 ＝ 平台视角。
#     Σ流水贡献 ÷ stake 中位 = 0.897810 ⇒ 流水贡献 ≈ 洗码（valid_bet），非本金（stake）。
polarity_registry:
  - {指标: profit, 视角: 平台, 极性: 越大越好, 注: 平台牌桌毛赢}
  - {指标: hold_rate, 视角: 平台, 极性: 越大越好, 注: profit ÷ stake}
  - {指标: hold_valid_bet, 视角: 平台, 极性: 越大越好, 注: profit ÷ valid_bet（我方派生，总包无此列）}
  - {指标: ngr, 视角: 平台, 极性: 越大越好, 注: profit − rebate_cost}
  - {指标: residual_b, 视角: 平台, 极性: 越大越好, 注: ngr − agent_cost ＝ 净利金额}
  - {指标: roi, 视角: 玩家, 极性: 越小越好, 注: ⛔ roi ≡ −hold_rate；玩家 roi 下降即平台得利}
  - {指标: 游戏输赢贡献, 视角: 平台, 极性: 越大越好, 注: ⛔ 名似玩家而实为平台；实测 ÷ profit 中位 = 1.000000}
  - {指标: house_edge_theoretical, 视角: 平台, 极性: 越大越好, 注: ⛔ 理论优势；现状 NULL，禁以 realized 顶替}
  - {指标: house_hold_pct, 视角: 平台, 极性: 越大越好, 注: 逐投注面口径，非会员级}
  - {指标: 流水贡献, 视角: 规模, 极性: 不直接判好坏, 注: ⛔ ≈ 洗码 valid_bet，非本金 stake（÷ stake 中位 0.8978）}
  - {指标: stake, 视角: 规模, 极性: 不直接判好坏, 注: 暴露量，非绩效}
  - {指标: n_bets, 视角: 证据, 极性: 不直接判好坏, 注: 证据量，非绩效}

# ── 加权登记册：候选 × 实测 × 裁定（⛔ 证明不了者一律不加）──────────────
#   实测日 2026-09-03 · 料源 S01_player_score.csv（723,442 会员）与 S05 月面板（OOS 对照）
#   总包加权现状：全档 weight／weighted／sample_weight／ipw／propensity／decay／precision 命中 0；
#     唯一双口径先例 p_base_round_w（注额加权）vs p_base_round_unw（等权），2026-08-11 增，
#     注明「供两种 estimand 对照」——★ 本册一切加权皆循此例：**并列双口径，不替换**。
weight_registry:
  iron_rules:
    - ⛔ KILL-W01 重复计权：精度权与暴露权实测 Spearman = 1.000000，二者并用即同一信息计两次
    - ⛔ KILL-W02 结果变量泄漏：profit／residual_b／roi 等结果量禁作权重
    - ⛔ KILL-W03 处理后泄漏：T0 之决策禁用 POST 期信息作权
    - ⛔ KILL-W04 极端权重：须并报 ESS 与 top1% 占权；ESS/n < 1% 标 THIN_WEIGHTED_EVIDENCE
    - ⛔ KILL-W05 方向反转：加权后若经济结论变号，须入 REDTEAM，禁自动认作「更精准」
    - ⛔ 加权造不出不存在的信号：本项目实测会员 hold 跨期秩相关 0.063276，任何加权皆不能提升其可预测性
  ess_thin_ratio: 0.01          # ESS/n 低于此即 THIN_WEIGHTED_EVIDENCE
  candidates:
    - {候选: 暴露权 stake, ESS占比: 0.001511, top1占权: 0.787906, 最大比中位: 796454.3,
       裁定: CONDITIONAL, 理由: 系「钱的真相」，然 723,442 名之有效样本仅 1,093，须并报 ESS}
    - {候选: 洗码权 valid_bet, ESS占比: 0.001515, top1占权: 0.787481, 最大比中位: 788503.8,
       裁定: CONDITIONAL, 理由: 同暴露权}
    - {候选: 证据权 n_bets, ESS占比: 0.012325, top1占权: 0.556954, 最大比中位: 69149.4,
       裁定: CONDITIONAL, 理由: 较暴露权稍缓，仍高度集中}
    - {候选: 精度权 1/(tau2+s2/stake), ESS占比: 0.450397, top1占权: 0.034312, 最大比中位: 7.3,
       裁定: ADMIT, 理由: ★ 唯一同时改善真实性与稳定性者——与暴露权同向（Spearman 1.000000）
         而集中度由 796454 倍降至 7.3 倍，ESS 由 0.15% 升至 45.04%；系暴露权之收缩稳定版}
    - {候选: 时间衰减 半衰期, ESS占比: null, top1占权: null, 最大比中位: null,
       裁定: REJECT, 理由: ⛔ 以 MASE 复裁（承先生令，标尺为训练期内朴素一步预测之 MAE：
         等权 0.13649951 ／ 暴露加权 0.06660540，出自 50,263 组月对、35,538 名会员）——
         暴露加权 MASE 单调劣化：不衰减 0.711262 → 3 月 0.722546 → 2 月 0.729284 → 1 月 0.753187
         → 0.5 月 0.811592；等权 MASE 同向（0.773872 → 0.795224）。
         与 RMSE 之裁定一致（不衰减最优），故 REJECT 维持。
         ⛔ 附带定谳：四估计器之暴露加权 MASE —— 全收缩 0.495977 ＜ 经验贝叶斯收缩 0.711262
         ＜ 原始观测 0.844977 ＜ 朴素一步 0.926022；四者皆 < 1（皆优于朴素），然最优者系【总体常数】}
    - {候选: 流失 IPW, ESS占比: 0.992300, top1占权: null, 最大比中位: 1.22,
       裁定: CONDITIONAL, 理由: 无权重爆炸（倾向分 0.354880~0.517890），然仅移动均值 −4.37%、
         中位不变 ⇒ 可观测量解释不了流失，⛔ 不足以把配对效应升为总体因果}
    - {候选: 产品混合标准化, ESS占比: null, top1占权: null, 最大比中位: null,
       裁定: CONDITIONAL, 理由: 逐面等权 8.042081% vs 暴露加权 1.866970% ＝ 4.31 倍，须声明标准人口}
  dual_estimand_policy: 一切加权量一律以 `_w`／`_unw` 双栏并列出示（循总包 p_base_round_w／_unw 先例），
    ⛔ 禁以加权值替换原值；并须同出 ess_* 与 w_top1_share_* 二诊断栏。

# ── 经济语义闸 ECONOMIC_SEMANTIC_GATE v1.0（十五条机检，全过方准全量重导）──
economic_semantic_gate:
  - {条: G01, 断言: hold_valid_bet ＝ profit ÷ valid_bet, 检法: 与 1.866970% 对账}
  - {条: G02, 断言: hold_rate ＝ profit ÷ stake, 检法: 逐行比对，越界须为 0 行}
  - {条: G03, 断言: roi 之视角为【玩家】, 检法: 极性登记册须载明}
  - {条: G04, 断言: roi ≡ −hold_rate, 检法: 逐行求和须恒为 0}
  - {条: G05, 断言: realized hold ≠ theoretical house edge, 检法: 二者须分栏分名，禁同名}
  - {条: G06, 断言: house_edge 不得等于任何 profit 比值, 检法: 扫全库不得有 house_edge 栏承载 realized 值}
  - {条: G07, 断言: theo 须有产品级 edge 方可算, 检法: 无 x_prod 粒度即 theo NULL}
  - {条: G08, 断言: 未知产品 edge → NULL, 检法: ⛔ 禁 fallback = 1（NULL ≠ 0）}
  - {条: G09, 断言: residual_b 系【经济分层】主轴而非【风控赏罚】主轴,
     检法: 实测 Spearman(residual_b, profit) = 0.998910；总包自标 admit_to_risk_decision = FALSE}
  - {条: G10, 断言: 相对排名栏（economic_value／action_priority／vip_tier）只供 DISPLAY, 检法: 禁入判据输入}
  - {条: G11, 断言: 配对存活效应 ≠ 总体因果效应, 检法: 须并出 PAIRING_COVERAGE 与 ATTRITION_RATE}
  - {条: G12, 断言: 蒙地卡罗未过 SCALING_GATE 不得人口外推, 检法: 投射倍数逾闸即只报每人效应}
  - {条: G13, 断言: 马尔可夫须有会员内变异, 检法: within-member variance = 0 → BLOCKED（非 WARNING）}
  - {条: G14, 断言: EVT 二法不一致须显式保留, 检法: EVT_STATUS = MODEL_DISAGREEMENT}
  - {条: G15, 断言: 盈亏平衡成本上限 ≠ 实际服务成本, 检法: service_cost_status 须为 NOT_REGISTERED}

# ── 四状态分离：⛔ 禁以单一 PASS 混淆工程／统计／因果／商业四义 ──────────
status_matrix:
  层次:
    - {层: ENGINEERING_STATUS, 取值域: [PASS, FAIL], 义: 码能跑、闸能过、对账能闭合}
    - {层: STATISTICAL_STATUS, 取值域: [PASS, CONDITIONAL, FAIL], 义: 检定与区间是否支持所称之效应}
    - {层: CAUSAL_STATUS, 取值域: [ESTABLISHED, NOT_ESTABLISHED], 义: 是否已排除选择与时间之混杂}
    - {层: DECISION_STATUS, 取值域: [ADMISSIBLE, BLOCKED], 义: 是否准入商业动作}
  escalation_rule: ⛔ 统计显著 ≠ 因果成立 ≠ 商业准入；四层须逐层独立裁定，禁跨层升格。
  temporal_vs_treatment: ⛔ PRE → POST 之改善只证【时间上的变化 TEMPORAL_CHANGE】；
    未有同期对照或反事实设计前，不得称 TREATMENT_EFFECT。实测：PI02 之 UNTREATED 无 PRE／POST 分期，
    故本窗**无法**构造双重差分（DiD），因果层一律 NOT_ESTABLISHED。

# ── 决策统计层：以期望损失最小、风险调整回酬最大择方案 ──────────────
decision_layer:
  seed: 20260903                 # 一切随机过程之种子；改此即改全部模拟结果，故登记在册
  monte_carlo_draws: 10000       # 蒙地卡罗前瞻抽样次数
  bootstrap_draws: 2000          # 自助法重抽次数（处理前后差之置信区间）
  min_paired_n: 20               # 处理前后配对之最低样本；不足即 NOT_RUN，⛔ 不降为 PASS
  bayes:
    method: empirical_bayes_normal      # 经验贝叶斯正态收缩；τ² 与 s² 由矩法自数据反解，不外生给定
    shrink_min_members: 200             # 反解 τ²／s² 之最低会员数
    posterior_prob_question: P(会员真实 hold < 0 | 观测)  # 即「长期占优」之后验概率
  mle:
    dist: [normal, exponential]  # 现阶段只认二族；他族须先登记再实作
    ci_level: 0.95
  markov:
    time_candidates: [bet_date, ym, month, bet_month, dt, date, day, 月份, 营业日]
    value_candidates: [stake, valid_bet, profit, n_bets, 流水贡献, 游戏输赢贡献, 洗码贡献]
    state_cuts: [0.25, 0.50, 0.75, 0.90]   # 以分位切状态：低／中低／中高／高／极高 五态
    min_transitions: 100                   # 转移样本不足即 NOT_RUN
  evt:
    threshold_quantile: 0.95     # POT 门限分位
    min_exceed: 50               # 超越样本不足即 NOT_RUN
    tail_var_levels: [0.99, 0.995]
    estimator: [pwm, mle]        # 概率加权矩 ＋ 极大似然，二法并报；不一致即标 ⚑
  actions:                       # 处置方案名册：一律取自实测台账之动作宇宙，禁凭空拟方案
    - {方案: A_不干预, 来源: 对照组（UNTREATED）, 台账映射: —, 服务成本: NOT_REGISTERED}
    - {方案: B_限额调整, 来源: TL10 action_class=edit, 台账映射: mem015 族, 服务成本: NOT_REGISTERED}
    - {方案: C_下注权限, 来源: TL11 enforcement_type=CANBET_下注权限, 台账映射: mem016, 服务成本: NOT_REGISTERED}
    - {方案: D_账户启停, 来源: TL11 enforcement_type=ENABLE_账户启停, 台账映射: mem017, 服务成本: NOT_REGISTERED}
  service_cost_status: NOT_REGISTERED   # ⛔ 复核／处置之单位成本未登记
  service_cost_policy: 未登记者一律反解【盈亏平衡成本上限】并标 NOT_REGISTERED，⛔ 禁臆造成本充数
  prepost_member_metrics:        # 会员层差额栏之方向；⛔ 未登记者不入退化裁定，只作描述
    - {差额栏: d_stake, 方向: up, 释义: 处置后本金规模}
    - {差额栏: d_validbet, 方向: up, 释义: 处置后洗码规模}
    - {差额栏: d_revenue, 方向: up, 释义: 处置后平台毛赢}
    - {差额栏: d_hold_pct, 方向: up, 释义: 处置后实收率（平台视角）}
    - {差额栏: d_roi, 方向: down, 释义: 处置后玩家回报率 —— ⛔ roi ≡ −hold_rate，下降即平台得利，
        与 d_hold_pct 上升系同一事实之两面，不得重复计入}
    - {差额栏: d_bets_per_day, 方向: neutral, 释义: 日均注单 —— 行为量，非经济指标，不入退化裁定}
  monte_carlo:
    extrapolation_warn_ratio: 10   # 投射倍数 ＝ 候选人数 ÷ 实测处置样本；逾此即挂 ⚑ 外插过度
  prepost_metrics:               # 处理前后回归闸之必比指标（方向：up＝越大越好，down＝越小越好）
    - {指标: sum_revenue 平台毛赢, 方向: up}
    - {指标: hold_pct 实收率, 方向: up}
    - {指标: sum_stake 本金规模, 方向: up}
    - {指标: sum_validbet 洗码规模, 方向: up}
    - {指标: revenue_per_member 人均毛赢, 方向: up}
    - {指标: 留存率（处置后仍投注）, 方向: up}
  degradation_rule: 任一【经济】指标处理后劣于处理前且差异过检定者，本闸判 FAIL —— 只增不减，严禁退化
  rl_status: BENCHED
  rl_reason: S3 处置映射与 S4 结果连结二闸未开（登记册 open_questions）；RL 只准 simulation／policy research，
    ⛔ 禁直接驱动商业动作。放行条件：二闸转 CLOSED 且处置—结果连结经样本外验证。

# ── 字段软定义：会员键别名、时间轴候选、ODS 字典表 ──────────────────────
fields:
  member_key_canonical: member_id
  member_key_aliases: [member_id, uid, player_id, mem, member_login]
  time_axis_name_hint: date|dt|ym|month|time|day|_at$
  time_axis_value_pattern: '^[0-9]{4}[-/][0-9]{1,2}([-/][0-9]{1,2})?|^[0-9]{6}$|^[0-9]{8}$'
  time_axis_min_match_rate: 0.9        # 取值形似日期之最低比例，低于此不认时间轴
  ods_dictionary_file: Z03_column_dictionary.csv
  ods_dict_cols: {table: 表名, ordinal: 列序, column: 列名, dtype: 存储类型,
                  nullable: 可空, raw_type: 原始类型, meaning: 业务含义, note: 原始注释}
  roi_numerator_candidates: [game_pnl, game_pnl_all, net_pnl, profit, 游戏输赢贡献]
  roi_denominator_candidates: [stake, stake_all, valid_bet, validbet, 流水贡献]

# ── 体量守门（v1.1.0 铁律：全量读取，禁抽样、禁截行）──────────────────
guards:
  full_scan_mandatory: true   # 全量铁律：一切交付件读全部行；任何截行即 stop()
  large_file_warn_mb: 300     # 逾此只登记「巨档」告警，【不】截行——巨档亦须全量
  rowcount_verify: true       # 全量核验：文件换行数 ↔ 载入行数逐件对账，不符即标出
  rowcount_verify_max_mb: 4096 # 逾此不作换行数核验（只登记 SKIPPED，不冒充已核）
  corr_min_n: 30              # 相关阵之最低非缺样本
  roi_outlier_threshold: 1.0  # roi > 此值 → 结算完整性候选（非优势玩家）

# ── 呈表纪律：长表 scroll-y，宽表 scroll-x，禁截行截列 ──────────────────
presentation:
  table_max_height: 520px     # 纵向视口；表体全行在册，只限视口高度
  table_max_height_wide: 640px
  overflow_x: auto
  overflow_y: auto
  number_big_mark: ','
  p_value_min_display: 1.0e-4 # p < 此值一律并呈原始量级，禁 0.0000 体例

# ── 统计口径（软数值：分位、置信、样本门）──────────────────────────────
statistics:
  tail_quantile_high: 0.90    # high 方向之尾部分位
  tail_quantile_low: 0.10     # low 方向之尾部分位
  tail_quantile_abs_z: 0.90   # jump/abnormal 之 |z| 分位
  confidence_level: 0.95
  z_two_sided: 1.959964       # 与 confidence_level 对应；改一处须同改
  wilson_target_width: 0.15   # 比例型指标之 CI 宽度上限，用以反解最低样本量
  degenerate_flag_rate: 0.50  # 尾部命中率逾此 → 判退化（P90 与下界重合）
  multiple_testing_methods: [BH, holm]
  pca_min_features: 2
  pca_scale: true
auc_bands:                    # 七档取代四档；judged 由此册现算，禁正文写死
  - {lo: 0.00, hi: 0.45, label: 方向反转（须查口径）}
  - {lo: 0.45, hi: 0.55, label: 无区分力}
  - {lo: 0.55, hi: 0.60, label: 极弱}
  - {lo: 0.60, hi: 0.65, label: 弱}
  - {lo: 0.65, hi: 0.75, label: 中}
  - {lo: 0.75, hi: 0.85, label: 强}
  - {lo: 0.85, hi: 1.01, label: 很强（须防泄漏）}

# ── 误判率控制（本轮专项）──────────────────────────────────────────────
false_positive_control:
  principles:
    - 一律以 Wilson 下界代点估计——点估计在小分母上系统性高估
    - 样本未过门者不出旗标，登记 UNKNOWN，永不降为「正常」
    - 尾部命中率逾 degenerate_flag_rate 即判退化，禁以百分之百之尾部冒充异常群
    - 多判据共现须与独立期望比（提升度），提升度 ≈ 1 者叠加不产生新信息
    - k 条判据同时筛查须报多重比较校正后之期望假阳数
  expected_false_positive_note: 以各判据尾部分位 q 计，独立假设下 k 条全命中之期望人数
    = N × Π q_i；实际共现显著高于此者方为证据。

# ── 名目勘正（软字符：正名在先，防同词异释）────────────────────────────
nomenclature:
  - {来件名目: 索题诺率, 勘正: 索提诺比率（Sortino Ratio）——仅罚下行波动之风险调整收益}
  - {来件名目: 隐马尔可夫链, 勘正: 标准称谓为隐马尔可夫模型（HMM）；「链」易与马尔可夫链混同——HMM 之状态不可观测}
  - {来件名目: RTP 大于 20%, 勘正: RTP（返还率）常为 97% 量级；此处应指 ROI（投资回报率）大于 20%}
  - {来件名目: 对打率 60% 与 75% 并存, 勘正: 同一文献摘要与正文表不一致；以正文表为准并登记矛盾}
  - {来件名目: 「优势玩家」, 勘正: 未经因果验证前一律称「行为异常候选」；优势玩家系结论，非观测}

# ── 模型名册：逐模审计（谁上场、谁替补、谁禁赛）──────────────────────
model_roster:
  - {模型: 梯度提升树（GBDT／XGBoost／LightGBM）, 角色: 主力, 需要: [member_level, features_ge_3], 裁定理由: 表格型会员特征之监督学习基线；任何深度模型上场前须先胜过它}
  - {模型: 随机森林／ExtraTrees, 角色: 主力, 需要: [member_level, features_ge_3], 裁定理由: 与 GBDT 残差高相关时禁组集成（集成无理论增益）}
  - {模型: 聚类（K-means／DBSCAN／GMM）, 角色: 主力, 需要: [member_level, features_ge_2], 裁定理由: 客群分层与批量注册甄别；产出画像不产出处置}
  - {模型: 主成分分析（PCA）, 角色: 先发工兵, 需要: [member_level, features_ge_2], 裁定理由: 降维与共线诊断；成分无业务语义，禁直接作风险分}
  - {模型: 自编码器（Autoencoder）, 角色: 主力, 需要: [member_level, features_ge_3], 裁定理由: 无标签可用时之首选异常侦测；本项目风险标签含噪，正合此境}
  - {模型: 隐马尔可夫模型（HMM）, 角色: 轮换, 需要: [time_axis], 裁定理由: 行为隐状态切换侦测；须防状态数过拟合（BIC 选阶）}
  - {模型: 状态切换（Regime-Switching）, 角色: 轮换, 需要: [time_axis], 裁定理由: 为监控带提供动态基线}
  - {模型: 生存分析（Cox／AFT／KM）, 角色: 主力, 需要: [time_axis, event], 裁定理由: 流失与标记时点双问}
  - {模型: 图算法（连通分量／社群发现）, 角色: 主力, 需要: [join_key], 裁定理由: 关系网络证据之唯一正途}
  - {模型: 夏普／索提诺／最大回撤, 角色: 主力（甄别指标）, 需要: [time_axis], 裁定理由: 高 ROI 低 Sharpe = 小分母；近零波动 = 打水候选}
  - {模型: CVaR（条件在险价值）, 角色: 主力（财务侧）, 需要: [member_level], 裁定理由: 尾部暴露与风险预算}
  - {模型: 贝叶斯层级收缩, 角色: 先发工兵, 需要: [member_level], 裁定理由: 小分母场景替换点估计}
  - {模型: Transformer（序列）, 角色: 禁赛（现阶段）, 需要: [long_sequence], 裁定理由: 长序列数据未成熟、可解释性方案未齐}
  - {模型: 强化学习（RL）, 角色: 禁赛（处置侧）, 需要: [long_sequence], 裁定理由: 处置侧禁用；伦理审查未过}

# ── 四条灵活搭配管线（特征层→模型层→决策层）────────────────────────
pipelines:
  - id: P1
    管线: ① 关系与网络
    需要角色: [JOIN_KEY]
    特征层: JOIN_KEY 列（IP／代理链／对边／时点键）
    模型层: 图算法（连通分量＋社群发现）→ 共线诊断
    决策层: E3/E4 证据打包 → 人工复核
    处置红线: 禁自动封禁；网络证据亦须过门禁
  - id: P2
    管线: ② 方向强度与分位分层
    需要角色: [STAT_DIRECTIONAL]
    特征层: STAT_DIRECTIONAL 列（high／low 尾部）
    模型层: 分位分层 → Wilson 收缩 → 秩法 AUC（= Mann–Whitney）
    决策层: 影子期静默打分，禁据以处置
    处置红线: 阈值未反解前禁处置
  - id: P3
    管线: ③ 状态切换与监控带
    需要角色: [STATE, FLAG, BUCKET]
    需要方向: [jump, abnormal]
    特征层: STATE／FLAG／BUCKET 列 · jump／abnormal 方向
    模型层: 动态基线带 → 破带即启复检
    决策层: 破带触发复检排程
    处置红线: 破带 ≠ 处罚，唯启复检
  - id: P4
    管线: ④ 恒等式与结算完整性
    需要角色: [IDENTITY]
    特征层: IDENTITY 列（应恒为零之残差）
    模型层: 残差检定（应恒为 0）→ 结算九项排查序
    决策层: 先修账，再谈风控结论
    处置红线: 禁以账务异常直接标记玩家

# ── 结算完整性九项排查序（roi 异常者先查账，后查人）──────────────────
settlement_checklist: [派彩含本金, 红利, 彩池, 退水, 冲正, 重复结算, 汇率, 部分结算, 人工调整]

# ── 五道铁门：统计验收之硬闸 ────────────────────────────────────────
iron_gates:
  - {id: G-01, 门: 口径冻结, 判定: 判据之分子分母与窗口须登记且不随分析漂移}
  - {id: G-02, 门: 样本门禁, 判定: 比例型指标之最低样本量须以 Wilson 反解，非手写}
  - {id: G-03, 门: 阈值反解, 判定: threshold_status 须脱离 PENDING_INVERSE}
  - {id: G-04, 门: 多重比较校正, 判定: 同批检验须并报 BH 与 Holm 校正}
  - {id: G-05, 门: 真样本外验证, 判定: 须有跨窗口 OOS，非同窗自证}
gate_wording_ban: [验证完成, 模型成立, 统计生产就绪, 风险模型上线, 已证明, 确认作弊]

# ── 商业方案落实前后对照（维度软定义）────────────────────────────────
before_after_dims:
  - {维度: 风控算力投向, 落实前: 单一方向堆模型, 落实后: 依判据角色分四管线}
  - {维度: 风险名单生成, 落实前: 单因子阈值直接出名单, 落实后: 多判据共现＋提升度＋Wilson 下界}
  - {维度: 监控基线, 落实前: 静态阈值破线即警, 落实后: 分位分层＋退化侦测}
  - {维度: 处置依据, 落实前: 统计显著即行动, 落实后: 门禁＋证据阶梯＋人工复核}
  - {维度: 误伤面, 落实前: 点估计小分母高估, 落实后: Wilson 下界＋最小暴露门槛两锁}
  - {维度: 模型上线门槛, 落实前: 各模型各说各话, 落实后: 五道铁门全 PASS 方可试运行}

# ── 商业措施三阶：按门禁派生（软字符）────────────────────────────────
measures_by_gate:
  FATAL:
    - 本类判据即刻撤出一切评分／触发／处置管道，只留画像字段
    - 既有以本类判据出数之名单一律作废并留痕
  BLOCK:
    - 本类判据即刻冻结于评分管道之外，画像字段亦加「阻断中」水印
    - 登记待闭项并指派责任人与复检日
  CONDITIONAL:
    - 本类判据进入影子期：静默打分、禁据以处置
    - 影子期内每周出 AUC 与提升度（含置信区间）
  ADVISORY:
    - 本类判据进入影子运行，出数供复核排序，禁作处置理由
    - 建立月度复跑与五道对帐钩
measures_pipeline:
  - 阈值逐指标反解（含 n_eff 校正），禁写普适门槛（P-06）
  - 单因子线索升级为跨表网络证据（会员→IP→设备→代理→对边→局→时）
  - 外部 L1a 标签独立复检，AUC 低于 0.5 即方向反转告警
  - 以 Wilson 下界代点估计，并报最低样本量之反解值

