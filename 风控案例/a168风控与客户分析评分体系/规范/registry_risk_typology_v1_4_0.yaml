    product_lock: bet02='101'（百家乐）
    universe_members: 721190
axes:
  evidence_tier:
    OBSERVED: 文档内／交付件内可直接计算复现
    INFERRED: 由已锁定事实推导，推导链须在 rationale 写明
    UNKNOWN: 须外部核实方可使用，禁止以推测填补
  gate:
    FATAL: 🔴 停止分析：该用法已被证伪或将致错误结论
    BLOCK: 🟠 禁入正式结论：存在未闭阻断项
    CONDITIONAL: 🟡 条件可用：须先满足 unblock_conditions
    ADVISORY: 🟢 建议可用：可进影子期，仍须完成 shadow_requirements
    NA: ⚪ 不适用
  severity:
    S1: 致命 FATAL
    S2: 阻断 BLOCK
    S3: 条件 CONDITIONAL
    S4: 建议 ADVISORY
