  revision_note: "v1.1.0：原 candidates 五项（多账户共享设备／机器人脚本／夜间异常／限红试探／静默复活） 全部提升为正式登记条目 T-11…T-15，各自挂载判据列、门禁裁定、阻断项与解锁条件。\
    \ 立册人裁示：一条带明确 UNKNOWN 与阻断条件的条目，胜于一个隐形空缺——隐形才是真危险。 候选桶自此清空并保留为空集，供日后新类型暂驻。 v1.2.0：承 §Z-12／§Z-14 首跑实测（2026-08-18）——源库\
    \ validbet 零 NULL 已双版互证， F-02 之实际影响归零，B-11 相应降级；T-05 首获 166 会员-月纯度 100% 标注样本集。 v1.3.0：v1.2.0 之依据已变，整版冻结重出。承\
    \ §Z-17／§Z-18／§Z-19（SQL 总包 v4-revised-2）： ① bet16／bet41 语义锁定（H16 恒等式 125,654,711／125,654,711 ＝ 100%）；\
    \ ② T-05 样本改自 §Z-14 且门槛由「承 S05 之 >=30」改为「逐层反解之 >=5」，\n   旧 166 行标 SUPERSEDED — legacy derivation，保留不删；\n\
    ③ 新增 treatment 四级状态表（S1 CLOSED／S2 PROVEN／S3·S4 OPEN），\n   并立防偷渡明令：「lmc02 接线键已解 ≠ treatment 已解」；\n\
    ④ 新增「证据存在 ≠ 评分主表存在」之准入二分； ⑤ DQ-COMMISSION 门与 P01A-contract-2 悬案入册。\nv1.4.0：四层防串线结构化（承 REDTEAM 预审 R4-01～R4-04\
    \ 与台账 RT-04～RT-12）：① 新增纵向证据链四层字段 phenomenon_status／label_validation_status／causal_status／admission\
    \ 二分（admit_to_feature_scoring／admit_to_risk_decision），全册 admit_to_risk_decision=FALSE×16 无例外；② criterion_role\
    \ 十枚举归一（STAT_DIRECTIONAL=42 闭环校验），direction 仅方向行非空；threshold_status 归四枚举，36 种原文全迁 threshold_note 一字不删（M-01：T-15/n_ip\
    \ 方向判据改判 PENDING_INVERSE，原文存注）；③ 主生命周期状态×阻断门禁双轴状态机（R4-02），废五层互斥制；④ 五门状态与解锁谓词机器化（R4-04）：G01 FAIL／G02\
    \ FAIL／G03 PARTIAL／G04 RENDER_COMPUTED／G05 FAIL（自评估档 v1.2.47 §gate5 取证）；⑤ RT-04 T-10 补 admit_to_profile:true；RT-05\
    \ T-05/T-08 回挂 B-11；RT-12 T-05 verdict 同步 §Z-14 口径，166 样本入 SUPERSEDED 证据登记；⑥ profile_feature 与 admit_to_feature_scoring\
    \ 彻底分立（防 WHERE profile_feature 误拉 T-03 入评分管线）。本版由 v1.3.0 双档（YAML MD5 90e8306d…／CSV MD5 e2267cd5…）机器派生。"
