  target: 卷一 §C-06 原版
  rule: 禁止运行，改跑 卷二 §C06fix
  reason: 原版以 '1'/'B'/'庄' 判庄闲，与库内实际 Banker/Player 不符，实测零行；且争抢同一导出文件名
  severity: S1
- id: P-04
  target: §S-04a
  rule: 禁止运行，改跑 §S04p
  reason: S-04a 出 IP 明细，风控员雷达需实体级聚合；争抢同一导出文件名
  severity: S2
- id: P-05
  target: ods_a168_bet01
  rule: 金额算式禁止施用于本表
  reason: 自 bet14 起与 ods_a168_bet02 整段错位（bet17 在本表为 LV3ID 而非净输赢）；误用则数值照算而结果全错且无任何报警
  severity: S1
- id: P-06
  target: 普适样本量门槛（如 n>=30）
  rule: 禁止手写
  reason: 最小样本量须逐指标反解，含有效样本量 n_eff 校正；MDE 须依 estimand、结局分布族与设计效应分别推导
  severity: S2
- id: P-07
  target: OFFSET 分页
  rule: 禁止使用，强制键集游标
  reason: 已实证 36.49% 重复率
  severity: S1
- id: P-09
  target: valid_bet 跨章合计
  rule: 条件许可：须先核验该窗口内 validbet 之 NULL 率为零，方可跨章合计
  reason: §T03 系与 §E02c 系对 validbet 之 NULL 处理契约不同（回退本金 vs 直取）。 2026-08-18 实测本窗口 NULL 率为零，两者等价；但该等价性依赖数据实况而非设计保证，
    故不设永久禁令，改设复检前提。核验方法见 §Z-14a 之 n_vb_null 列。
  severity: S3
- id: P-08
  target: 以 DATE(bet08) 切日
  rule: 禁止；窗口切日唯一合法字段为 dt（= bet07 账户日期）
  reason: 两者差异 38.6%
  severity: S1
