scoring_matrix:
  principle: 不做单一分数。行为维度对外部标签 AUC≈0.5 乃至反向，规模维度 AUC 高但受复核强度混杂污染； 压成一个分数等于让『注额大』冒充『风险高』，业务读不懂亦不服。
  risk_axis_rule: 风险轴仅由 admit_to_scoring=true 之类型构成；每一分必须可溯源到某一交付件某一列。
  cells:
  - value: V3
    risk: R3
    action: 立即复核 · 处置须高层批准（高价值×强证据）
  - value: V3
    risk: R2
    action: 优先复核
  - value: V3
    risk: R1
    action: 观察 · 保护优先（勿误伤）
  - value: V2
    risk: R3
    action: 复核
  - value: V2
    risk: R2
    action: 进复核队列
  - value: V2
    risk: R1
    action: 常规
  - value: V1
    risk: R3
    action: 复核
  - value: V1
    risk: R2
    action: 抽检
  - value: V1
    risk: R1
    action: 不动
  - value: V0
    risk: R0
    action: 不动
  - value: V0
    risk: R1
    action: 不动
  - value: V0
    risk: R2
    action: 抽检
  - value: V0
    risk: R3
    action: 复核
  - value: V1
    risk: R0
    action: 不动
  - value: V2
    risk: R0
    action: 常规
  - value: V3
    risk: R0
    action: 观察 · 保护优先（勿误伤）
  expansion_note: ★ v1.5.001 扩 3×3 → 4×4（V0–V3 × R0–R3）；既有九格之 action 文字一字未改，仅补七格。R 级为【证据强度】级，非危害级。
  axis_semantics:
    V: V0 Low / V1 Standard / V2 High Value / V3 Strategic
    R: R0 Normal / R1 Watch / R2 High Risk / R3 Critical（证据强度）
vertical_chain:
  note: 纵向证据升级链（四逻辑层，非字段层）；其余字段为横向正交元数据（criterion_role／threshold_status／external_standard_status／applicability_status／lifecycle_state／blocker_state）。
  L1: Evidence / Phenomenon
  L2: Label Validation
  L3: Causal / Mechanism
  L4: Admission
  iron_rule: OBSERVED ≠ LABEL_VALIDATED ≠ CAUSALLY_ESTABLISHED ≠ ADMITTED_TO_RISK_DECISION；逐层独立举证，禁止跨层滑移。
state_machine:
  name: 主生命周期状态 × 阻断门禁双轴状态机
  lifecycle_states:
  - SHADOW_MODEL
  - PROFILE_CANDIDATE
  - FATAL_PROFILE_ONLY
  - INTERNAL_CONTROL
  blocker_states:
  - UNBLOCKED
  - BLOCKED(B-xx)
  note: BLOCKED 非生命周期层，系 admission gate 之状态；两轴独立并存（例：T-05 SHADOW_MODEL × BLOCKED(B-11·随窗口复检)）。
gates:
  source: 尾段投注基础分析的评估_v1_2_47（§gate5_五门状态，OBSERVED）
  G01:
    name: 真实靴生命周期
    status: FAIL
  G02:
    name: uid×shoe_id 逐靴配对
    status: FAIL
  G03:
    name: 晚／早双侧最小暴露
    status: PARTIAL
  G04:
    name: 多重校正 raw→BH/Holm
    status: RENDER_COMPUTED
    note: 状态由评估档渲染现算判定，不得静态断言
  G05:
    name: 真正跨窗 OOS
    status: FAIL
  global_gate_status: NOT_PASS
mcid_cost_anchor_status: BLOCKED（待 Treatment Ledger 完成）
unlock_predicate:
  risk_decision_unlock: (gates.G01=='PASS') AND (gates.G02=='PASS') AND (gates.G03=='PASS') AND (gates.G04=='PASS') AND (gates.G05=='PASS') AND (type.label_validation_status=='TESTED_PASS') AND (type.causal_status=='ESTABLISHED') AND (mcid_cost_anchor_status=='ESTABLISHED')
  rules:
  - 五门任一非 PASS 时 admit_to_risk_decision 不得解锁（R22）
  - L3 因果层不得跳过：causal_status 非 ESTABLISHED 时 admit_to_risk_decision 不得解锁（v1.5.0 新增，补 L3）
  - SUPERSEDED 证据不得满足 TESTED_PASS（R20，血统防复活，与 T-03 禁复活同构）
  - external_standard_status 不得作为四层升级证据（R25）
  - profile_feature ≠ admit_to_feature_scoring，评分管线只准 JOIN admit_to_feature_scoring（R24）
