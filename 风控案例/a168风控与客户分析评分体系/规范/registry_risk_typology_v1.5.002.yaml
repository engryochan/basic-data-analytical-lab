  iron_rule: 禁令若无检出手段，等于没有禁令。故每条须配 negative_assurance_evidence；无者标 UNAUDITABLE_COMMITMENT。
  inherited_from_global_prohibitions:
  - P-01
  - P-02
  - P-03
  - P-04
  - P-05
  - P-06
  - P-07
