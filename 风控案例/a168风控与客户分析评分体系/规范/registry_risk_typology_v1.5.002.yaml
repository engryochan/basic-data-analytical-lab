  - *id007
  - *id008
  - *id009
  - id: P-10
    target: 切 IP／自动换 IP 作为身份重置
    rule: 永久封存
    severity: S1
    reason: IP 若成为身份重置按钮，即构成规避风险控制与账户管控。IP 在本系统只作识别坐标（entity_resolution），永不作身份重置。
    negative_assurance_evidence: UNAUDITABLE_COMMITMENT — 须建「同自然人跨 IP 续投」检出探针
  - id: P-11
    target: 调整 RNG seed／re-seed 以对付特定玩家
    rule: 永久封存
    severity: S1
    reason: 触碰游戏公平性核心。正解为不改变游戏结果，只改变是否、以何条件、在何公开规则下提供服务。
    negative_assurance_evidence: ★已具备：fairness_assurance_monitor —— p_base_incl(BANKER)=0.4586244 vs 八副牌理论 0.458597，差 0.0000274（n=124,713,543）
  - id: P-12
    target: 动态改赔率
    rule: 永久封存
    severity: S1
    reason: 牌照级风险
    negative_assurance_evidence: UNAUDITABLE_COMMITMENT — 须建赔率表版本快照与变更审计轨
  - id: P-13
    target: 蜜罐诱饵桌台
    rule: 永久封存
    severity: S1
    reason: 牌照级风险
    negative_assurance_evidence: UNAUDITABLE_COMMITMENT
  - id: P-14
    target: 强制整数下注
    rule: 永久封存
    severity: S1
    reason: 牌照级风险
    negative_assurance_evidence: UNAUDITABLE_COMMITMENT
  - id: P-15
    target: 以全窗口百分位定赏罚线
    rule: 禁止
    severity: S1
    reason: economic_value 泄漏已证；且违 temporal_admissibility（source_max_dt ≤ feature_as_of）
    negative_assurance_evidence: window_scope 栏机检：FULL_WINDOW 者禁入预测
  - id: P-16
    target: 以实现输赢符号（net_margin/roi/economic_value 之正负）定罚
    rule: 禁止
    severity: S1
    reason: 三条独立实证：G-07（罚桶下期净额皆为正，高敞口×上期我方亏 8,889 人下期人均 2,213 为全矩阵最高）· PI02（处置组 hold 1.709% < 未处置 1.964%）· X_combo（flag_ip=1 人均 −1,650 vs flag_ip=0 −1,009）
    negative_assurance_evidence: criterion_family 栏机检：OUTCOME_BASED 者 admit_to_risk_decision 恒 FALSE
  - id: P-17
    target: 无阈值之判据出「判定」
    rule: 禁止；只得出分布与排序
    severity: S2
    reason: 承 B-2：42 条方向判据中 36 PENDING_INVERSE、7 BLOCKED；65/66 判据 threshold 为 NA
    negative_assurance_evidence: threshold_status 栏机检
  - id: P-18
    target: T-03 尾投／靴尾下注之任何评分／排序／触发／处罚
    rule: 四枚布尔全 false，永不复活
    severity: S1
    reason: 承 B-5；四项独立检验（Sign p=0.7591 · Wilcoxon p=0.8087 · 九档 hold% 扫描零命中 · 外部标签 AUC=0.3828 方向反转）；P11 另添旁证 roi_late −0.01748 < roi_non_late −0.01663
    negative_assurance_evidence: ranking/scoring/trigger/enforcement 四栏机检恒 false
  - id: P-19
    target: admit_to_risk_decision = TRUE
    rule: 五门未开，十六皆锁
    severity: S1
    reason: 承 B-6 与 unlock_predicate；实况 G01 FAIL·G02 FAIL·G03 PARTIAL·G04 RENDER_COMPUTED·G05 FAIL·global NOT_PASS；causal_status 无一 ESTABLISHED；mcid_cost_anchor_status BLOCKED
    negative_assurance_evidence: unlock_predicate 机器谓词
  - id: P-20
