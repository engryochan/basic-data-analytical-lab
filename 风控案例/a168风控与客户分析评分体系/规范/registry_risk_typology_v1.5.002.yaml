metric_semantics_ruling:
- column: economic_value
  current: PERCENT_RANK() OVER (ORDER BY -e.net-e.rebate-e.agent_cost)
  meaning: 平台真净利（residual_b）之全体百分位秩，0..1
  ruling: 非金额；禁作『经济价值』读；建议正名 net_margin_pr_global，旧名保留兼容
- column: risk_value
  current: PERCENT_RANK(roi)
  meaning: 恒等于 roi_pr_global（F-17）
  ruling: 兼容列，HF9g 起废弃；与『风险』无关
- column: profit（六层块）
  current: "ROUND(-e.net,4)，e.net = bet17/bet11"
  meaning: "★CC-01：bet17 已含退水 ⇒ profit = GGR − 退水 = NGR（T03 逐行 net_pnl == game_pnl + rebate 100%；DX05 product 101 ggr 234,152,957 = Σprofit + Σrebate_cost）"
  ruling: profit 即 NGR；总包头注『profit = 平台牌桌毛赢』与实况相悖，须改注
- column: ngr（六层块）
  current: "-e.net - e.rebate"
  meaning: GGR − 2×退水（退水重复扣减）
  ruling: DEPRECATED_DOUBLE_DEDUCTION：不得作 NGR 用；NGR 取 profit 栏
- column: ggr_gross（本册派生）
  current: profit + rebate_cost = −游戏输赢贡献（M02）
  meaning: 毛利 GGR
  ruling: "平台毛利之唯一口径；hold_gross = ggr_gross/stake = 1.7427%（洗码口径 1.9349%）"
- column: net_margin_bet23_formal_canonical
  current: "-e.net - e.rebate - e.agent_cost"
  meaning: NGR − 代理成本（bet23 候选 B）
  ruling: AG-03 UNRESOLVED ⇒ 只作排序，不作绝对额对外
- column: residual_b / cost_complement_b
  current: 同上之旧名
  meaning: canonical 对应列
  ruling: 保留兼容，禁互代
- column: hold_rate
  current: "-e.net/e.stake"
  meaning: ★CC-01：系 NGR 率（bet17 口径），非毛利率
  ruling: 率型：须并读 evidence_rate 与 hold_ci_halfwidth_approx；对外须标『NGR 率』
- column: roi（六层块）
  current: e.net/e.stake
  meaning: 会员净回报率，bet17 口径（含退水），= −hold_rate
  ruling: "OPT 总包 128 处定义；ROI>0 非任何类判据（SC-15 §八 锁 4）"
- column: hold_ci_halfwidth_approx
  current: 1.96·0.95/√n_rounds
  meaning: "hold 95% CI 半宽近似"
  ruling: 逐行现算；L5 者半宽 ≫ 效应量
- column: action_priority
  current: A/D/E/Z 由 PERCENT_RANK 与 n_bets/n_rounds<30 定
  meaning: 总包决策标签
