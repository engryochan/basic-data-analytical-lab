    主·商业方案: 随机取一正一负，模型给正样本更高分的概率。0.5 为瞎猜。
    R01前: 曲线下面积（Area Under ROC Curve），0.5＝该维度与标签毫无关系（等同随机猜测），1.0＝完美分辨，0＝完全反向。本报告以秩相关手算法实现（等价 Mann-Whitney
      U），不引入外部依赖包。
    R01后: 曲线下面积（Area Under ROC Curve），0.5＝该维度与标签毫无关系（等同随机猜测），1.0＝完美分辨，0＝完全反向。本报告以秩相关手算法实现（等价 Mann-Whitney
