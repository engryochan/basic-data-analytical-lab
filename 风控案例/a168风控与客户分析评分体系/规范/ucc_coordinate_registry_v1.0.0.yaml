# =====================================================================
# UCC · 统一判据坐标登记册（Unified Criterion Coordinates）v1.0.0
# ---------------------------------------------------------------------
# 身份 : 规范件（规范/）★ 非交付件、非执行件
# 日期 : 2026-09-03
# 母本 : 《参考.txt》§八「UCC — Unified Criterion Coordinates」之七轴分层，
#        经 2026-09-03 全库 134 件逐表逐列实测校核后落册。
# ---------------------------------------------------------------------
# 【本册立意 —— 一句话】
#   ⛔ 统一坐标所统一者，是【语义、符号、单位、分母、经济方向、证据等级】，
#      **不是「所有 CSV 必须拥有相同列」**。
#   134 张交付件不应追求 134 × 全指标；应按【表类】各就其位。
#   此语出《参考.txt》§九，经实测确认为本项目最应采纳之一条，特列为本册第一原则。
#
# 【第二原则】不得把「检验结果」与「会员经济状态」放进同一字段层。
#   Wilcoxon／符号检验／AUC／Wilson 系【统计证据层】之产物，非会员之静态经济栏。
#
# 【第三原则】NULL ≠ 0；UNKNOWN ≠ FAIL；NOT_RUN ≠ PASS；缺件 ≠ 缺算。
# =====================================================================

registry:
  name: ucc_coordinate_registry
  version: 1.0.0
  issued: '2026-09-03'
  parent: a168_SQL总包_v12_0_0_HF9g-P5D_六层商业版_OPT（134 模块）
  evidence: 审计/交付件134_关键指标在位矩阵_v1.0.0_20260903.csv（129 件实测表头 ＋ 5 件声明列）

# ── 七轴 ────────────────────────────────────────────────────────────
axes:
  - {轴: E,  名: Economic 经济实际层,   义: 已实现之钱与其分母,        地位: 主轴}
  - {轴: T,  名: Theoretical 理论经济层, 义: 以理论 edge 推得之期望值,  地位: ⛔ 未闭合}
  - {轴: R,  名: Risk/Deviation 风险偏离层, 义: 方向、偏离、异常之描述量, 地位: 描述／辅助}
  - {轴: Q,  名: Evidence 证据层,       义: 样本量与不确定性,          地位: 一切裁定之前提}
  - {轴: TS,名: Time-Series 时序风险层, 义: 须日序方可算之风险量,      地位: 条件适用}
  - {轴: C,  名: Causal 因果／实验层,   义: 处置效应与检验,            地位: 条件适用}
  - {轴: M,  名: Model Validation 模型评价层, 义: 判别力与提升度,      地位: 模型侧}
  - {轴: E2,名: Entity Economics 实体经济层, 义: 以实体数为分母之单位经济, 地位: 条件适用}

# ── 逐指标正名与状态（2026-09-03 全库实测）──────────────────────────
#   在位件数 = 该栏名于 134 件中实际出现之件数（129 件以实测表头计，5 件以总包声明列计）
metrics:
  - {指标: profit,        轴: E,  算式: −e.net（平台牌桌毛赢）,          在位件数: 130, 状态: 已落地, 视角: 平台, 极性: 越大越好}
  - {指标: stake,         轴: E,  算式: bet13 ÷ bet11,                   在位件数: 131, 状态: 已落地, 视角: 规模, 极性: 不判好坏}
  - {指标: valid_bet,     轴: E,  算式: validbet ÷ bet11,                在位件数: 131, 状态: 已落地, 视角: 规模, 极性: 不判好坏}
  - {指标: ngr,           轴: E,  算式: profit − rebate_cost,            在位件数: 129, 状态: 已落地, 视角: 平台, 极性: 越大越好}
  - {指标: hold_rate,     轴: E,  算式: profit ÷ stake,                  在位件数: 127, 状态: 已落地, 视角: 平台, 极性: 越大越好}
  - {指标: hold_valid_bet, 轴: E, 算式: profit ÷ valid_bet,              在位件数: 0,
     状态: ⛔ 无此列 —— 只存于配置册之正名与报表侧现算；⛔《参考.txt》称「已存在／已明确正名」经实测判伪,
     视角: 平台, 极性: 越大越好}
  - {指标: game_pnl,      轴: E,  算式: (bet14 − bet13) ÷ bet11（会员视角）, 在位件数: 16,
     状态: 部分件有 —— 非通栏, 视角: 玩家, 极性: 越小越好}
  - {指标: net_margin,    轴: E,  算式: ngr − agent_cost,                在位件数: 0,
     状态: ⛔ 裸名不在位 —— 实有 8 个 net_margin_*_canonical 变体（四候选 × 值/率），AG-03 未决；
       ⛔ 取任一即等于替 AG-03 定谳，须先裁, 视角: 平台, 极性: 越大越好}
  - {指标: residual_b,    轴: E,  算式: −e.net − e.rebate − e.agent_cost, 在位件数: 129,
     状态: 已落地；⛔ 与 profit 之 Spearman ＝ 0.998910，系【经济分层】轴，非【风控赏罚】轴（G09）,
     视角: 平台, 极性: 越大越好}
  - {指标: economic_value, 轴: E, 算式: PERCENT_RANK() OVER (ORDER BY residual_b), 在位件数: 128,
     状态: ⚠️ 系【秩】非金额；corr(economic_value, residual_b) ＝ −1.0000；DISPLAY ONLY, 视角: 平台, 极性: 不判好坏}
  - {指标: theo,          轴: T,  算式: Σ(valid_bet_j × house_edge_theoretical_j), 在位件数: 0,
     状态: ⛔ 阻断 —— 理论 edge 未授权 ＋ 无 x_prod（会员 × 产品）粒度, 视角: 平台, 极性: 越大越好}
  - {指标: adt,           轴: T,  算式: theo ÷ active_days,              在位件数: 0, 状态: ⛔ 随 theo 阻断}
  - {指标: nmpt,          轴: T,  算式: residual_b ÷ theo,               在位件数: 0, 状态: ⛔ 随 theo 阻断}
  - {指标: esi,           轴: T,  算式: 注种选择优势指数（须 bet09 级 edge）, 在位件数: 0, 状态: ⛔ 随 theo 阻断}
  - {指标: roi,           轴: R,  算式: e.net ÷ e.stake（玩家视角）,      在位件数: 128,
     状态: 已落地；⛔ roi ≡ −hold_rate（723,442 行 100.000000% 恒等）, 视角: 玩家, 极性: 越小越好}
  - {指标: n_rounds,      轴: Q,  算式: 局数,                            在位件数: 126, 状态: 已落地}
  - {指标: n_bets,        轴: Q,  算式: 注单数,                          在位件数: 126, 状态: 已落地}
  - {指标: evidence_flag, 轴: Q,  算式: n_rounds < 30 → THIN_ROUNDS,      在位件数: 126, 状态: 已落地}
  - {指标: evidence_rate, 轴: Q,  算式: 依 n_rounds 分五档（L1_POWERED…）, 在位件数: 126, 状态: 已落地}
  - {指标: hold_ci_halfwidth_approx, 轴: Q, 算式: 1.96 × 0.95 ÷ √n_rounds, 在位件数: 126, 状态: 已落地（粗略）}
  - {指标: 索提诺稳定性,   轴: TS, 算式: ⛔ 未证,                          在位件数: 1,
     状态: ⛔ 名涉索提诺而实未验 —— 实测 567,099 名中 341,821 名（60.2754%）恰等于 −1、中位 −1、
       与 active_days 之 Spearman ＝ +0.9227、与 profit 仅 −0.0423；⛔ 不得据名认作 Sortino Ratio,
     视角: 待裁, 极性: 待裁}
  - {指标: mdd,           轴: TS, 算式: peak − trough（须日序）,          在位件数: 0,
     状态: 报表侧可现算 —— 平台层实测以 ggr_sum 为日收益者 MDD ÷ 累计 ＝ 0.051923%（139 日），
       与《参考.txt》所称 0.052% 逐位相符；以 profit 为基者 0.086628%、以 ngr 者 0.123954%
       ⇒ ⛔ 引用 MDD 必带【基准口径】,
     视角: 平台, 极性: 越小越好}
  - {指标: sharpe,        轴: TS, 算式: 须收益序列,                       在位件数: 0, 状态: ⛔ 引擎未实作（非不适用）}
  - {指标: sortino,       轴: TS, 算式: 须下行收益序列,                   在位件数: 0, 状态: ⛔ 引擎未实作（非不适用）}
  - {指标: apuc,          轴: E2, 算式: profit ÷ 实体数,                 在位件数: 0, 状态: ⛔ 引擎未实作；可现算，须先剔测试线}
  - {指标: effect,        轴: C,  算式: 处置后 − 处置前,                  在位件数: 3, 状态: 已落地（局部 · 仅 PI01 等 3 件）}
  - {指标: expected_gain, 轴: C,  算式: "E[Δ经济增益]",                    在位件数: 0, 状态: 报表侧现算（§15.5/15.6）}
  - {指标: wilcoxon,      轴: C,  算式: 配对秩和检验,                    在位件数: 0, 状态: 报表侧现算（§16.2）；⛔ 非会员静态栏}
  - {指标: sign_test,     轴: C,  算式: 符号检验,                        在位件数: 0, 状态: 报表侧现算（§16.2）；⛔ 非会员静态栏}
  - {指标: auc,           轴: M,  算式: 秩法 AUC（＝ Mann–Whitney）,      在位件数: 0, 状态: 报表侧现算（tr_auc）}
  - {指标: wilson,        轴: M,  算式: Wilson 区间,                     在位件数: 0, 状态: 报表侧现算（tr_wilson_lo/hi）}
  - {指标: lift,          轴: M,  算式: 观测共现 ÷ 独立期望,             在位件数: 1, 状态: 已落地（判据列 · 仅 R02_same_table）}

# ── 表类 → 应统一拥有之坐标（承《参考.txt》§九）──────────────────────
#   ⛔ 本表只规定「该类表应具备哪几轴」，不规定「必须有哪几列」。
table_class_axes:
  - {表类: 会员经济主表,     应有轴: [E, Q, R],        例: S01_player_score · R01_late_shoe · S_player_tail · T03_arbitrage}
  - {表类: 会员时序表,       应有轴: [E, Q, R, TS],    例: S05_member_month_panel · P12c_member_daily_pnl · T02_daily_roi}
  - {表类: 日度平台表,       应有轴: [E, Q, TS],       例: P12a_platform_daily · D03S_daily_roi_diff}
  - {表类: 产品／投注面表,   应有轴: [E, T],           例: DX04_bet09_profile · DX05_product_panorama · HE01_bet_side_edge}
  - {表类: 荷官表,           应有轴: [E, Q, R],        例: S02_dealer_score · S02b_dealer_pace}
  - {表类: 代理表,           应有轴: [E, Q, E2],       例: S03_agent_score}
  - {表类: 对打／关联表,     应有轴: [R, Q, M],        例: R02_same_table · C06_hedge_pairs · I_ip_player}
  - {表类: 处置台账表,       应有轴: [C, Q],           例: TL10_treatment_ledger · TL11_treatment_episode · PI01/PI02}
  - {表类: 画像／PROFILE 表, 应有轴: [R],              例: K01_risk_feature_matrix}
  - {表类: 探针／审计表,     应有轴: [Q, M],           例: Z0x 族 · VB_4x 族 · QSB 族}
  - {表类: 字典／元数据表,   应有轴: [],               例: DICT_ALL_columns · DICT_ALL_tables · DICT_SEMANTIC_ruling}
  - {表类: 局级事实表,       应有轴: [E, Q],           例: RK01_round_fact}

# ── 缺口台账（2026-09-03 实测；⛔ 缺件与缺算须分辨）────────────────
gaps:
  - {类: 缺件（阻断）, 指标: [theo, adt, nmpt, esi],
     成因: 理论 edge 未授权；且 ＃017 探针 R3 实测 overdispersion Q/(k−1) ＝ 9.3~42.6，单常数 edge 架构已 KILL；
       另缺 x_prod（会员 × 产品）中间粒度,
     处置: 三者未齐前一律 NULL；⛔ 禁以 realized 值顶替}
  - {类: 缺算（引擎未实作）, 指标: [sharpe, sortino, apuc],
     成因: 引擎 §15 只实作 Bayes／MLE／Markov／EVT／MC／ExpectedLoss，未含此三者,
     处置: ⛔ 标「未实作」，禁冒充「不适用」；补作时须限于【具日序或实体粒度】之表}
  - {类: 设计如此（报表侧现算）, 指标: [mdd, expected_gain, wilcoxon, sign_test, auc, wilson, pca],
     成因: 系统计证据与决策之产物，非会员静态经济栏,
     处置: 留在报表侧；⛔ 禁下沉为 134 件之列}
  - {类: 命名污染, 指标: [hold_valid_bet, net_margin, 索提诺稳定性],
     成因: hold_valid_bet 全库 0 栏；net_margin 裸名 0 栏而有 8 变体（AG-03 未决）；
       索提诺稳定性 60.2754% 恰等于 −1、与 active_days 秩相关 0.9227，名实未符,
     处置: 三者一律带限定引用；索提诺稳定性 须查其定义后正名或改名}

# ── 引用纪律 ────────────────────────────────────────────────────────
citation_discipline:
  - ⛔ 引用 hold 必带分母（对本金抑或对洗码）
  - ⛔ 引用 MDD 必带基准（ggr_sum／profit／ngr 三者之 MDD 相差逾一倍）
  - ⛔ 引用 net_margin 必指明四候选之哪一支，并注 AG-03 PENDING
  - ⛔ 引用 economic_value／vip_tier／action_priority 一律标 DISPLAY ONLY
  - ⛔ 引用 索提诺稳定性 须注「名涉索提诺而实未验」
